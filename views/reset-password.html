<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css?v=3" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <title>Reset Password - AnimePlus</title>
    <meta name="description" content="AnimePlus Reset Password - AnimePlus - View details, recommendations, and manage your anime list.">
  <style>
    body.reset-password-body {
      background-color: #200820;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .reset-card {
      background: rgba(32, 8, 32, 0.85);
      backdrop-filter: blur(20px);
      color: white;
      padding: 40px;
      border-radius: 24px;
      width: 400px;
      max-width: 100%;
      text-align: center;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(172, 74, 146, 0.2);
      animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .reset-card img {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(172, 74, 146, 0.3));
    }
    .reset-card h2 {
      color: white;
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .reset-card p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .reset-card input {
      width: 100%;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 15px;
      outline: none;
      border: 1px solid rgba(172, 74, 146, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .reset-card input:focus {
      background: rgba(172, 74, 146, 0.1);
      border-color: #ac4a92;
      box-shadow: 0 0 15px rgba(172, 74, 146, 0.3);
    }
    .reset-card button {
      padding: 14px 20px;
      width: 100%;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ac4a92, #8b2f7a);
      cursor: pointer;
      font-weight: bold;
      color: white;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(172, 74, 146, 0.3);
      letter-spacing: 1px;
    }
    .reset-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(172, 74, 146, 0.5);
      filter: brightness(1.1);
    }
    .reset-card button:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.3);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .reset-card .success-icon {
      font-size: 60px;
      color: #22c55e;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.3));
    }
    .reset-card .error-icon {
      font-size: 60px;
      color: #ef4444;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.3));
    }
    .back-home-btn {
      display: inline-block;
      margin-top: 20px;
      color: #ac4a92;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      transition: color 0.3s ease;
    }
    .back-home-btn:hover {
      color: #c956ab;
      text-decoration: underline;
    }
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body class="reset-password-body">
  <div class="reset-card">
    <div id="resetFormContainer">
      <img width="200" height="90" src="../assets/images/لقطة_شاشة_2025-06-14_185723-removebg-preview.png" alt="Logo" />
      <h2>Reset Password</h2>
      <p>Enter your new password below to complete the reset process.</p>
      
      <form id="resetPasswordForm">
        <div class="password-wrapper" style="position: relative; width: 100%;">
          <input type="password" id="newPassword" placeholder="New Password" required minlength="8">
          <i class="fa-solid fa-eye-slash toggle-eye" style="position: absolute; right: 15px; top: 22px; color: #aaa; cursor: pointer;"></i>
        </div>
        <div class="password-wrapper" style="position: relative; width: 100%;">
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="8">
          <i class="fa-solid fa-eye-slash toggle-eye" style="position: absolute; right: 15px; top: 22px; color: #aaa; cursor: pointer;"></i>
        </div>
        <button type="submit" id="resetBtn">Change Password</button>
      </form>
    </div>
    
    <div id="statusContainer" style="display: none;">
      <!-- Success/Error dynamic markup will go here -->
    </div>
  </div>

  <script defer src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      
      const formContainer = document.getElementById("resetFormContainer");
      const statusContainer = document.getElementById("statusContainer");
      const resetForm = document.getElementById("resetPasswordForm");
      
      if (!token) {
        formContainer.style.display = "none";
        statusContainer.style.display = "block";
        statusContainer.innerHTML = `
          <i class="fa-solid fa-circle-xmark error-icon"></i>
          <h2>Invalid Link</h2>
          <p>No password reset token was found in the URL. Please request a new password reset link.</p>
          <a href="home.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        `;
        return;
      }
      
      // Eye toggle helpers
      document.querySelectorAll(".toggle-eye").forEach(eye => {
        eye.addEventListener("click", () => {
          const input = eye.previousElementSibling;
          if (input.type === "password") {
            input.type = "text";
            eye.classList.replace("fa-eye-slash", "fa-eye");
          } else {
            input.type = "password";
            eye.classList.replace("fa-eye", "fa-eye-slash");
          }
        });
      });
      
      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const password = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const resetBtn = document.getElementById("resetBtn");
        
        if (password !== confirmPassword) {
          if (window.AnimePlusAuth && window.AnimePlusAuth.showToast) {
            window.AnimePlusAuth.showToast("Passwords do not match.", "error");
          } else {
            alert("Passwords do not match.");
          }
          return;
        }
        
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';
        
        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password, confirmPassword })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            formContainer.style.display = "none";
            statusContainer.style.display = "block";
            statusContainer.innerHTML = `
              <i class="fa-solid fa-circle-check success-icon"></i>
              <h2>Password Reset Successful</h2>
              <p>Your password has been successfully updated. You can now login with your new password.</p>
              <a href="home.html" class="back-home-btn" id="loginRedirectBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Go to Login</a>
            `;
            
            // Auto open login modal when clicking Go to Login
            document.getElementById("loginRedirectBtn").addEventListener("click", (e) => {
              e.preventDefault();
              // Redirect to home and append query to show modal
              window.location.href = "home.html?showLogin=true";
            });
          } else {
            resetBtn.disabled = false;
            resetBtn.innerHTML = "Change Password";
            if (window.AnimePlusAuth && window.AnimePlusAuth.showToast) {
              window.AnimePlusAuth.showToast(data.error || "Reset failed", "error");
            } else {
              alert(data.error || "Reset failed");
            }
          }
        } catch (err) {
          resetBtn.disabled = false;
          resetBtn.innerHTML = "Change Password";
          if (window.AnimePlusAuth && window.AnimePlusAuth.showToast) {
            window.AnimePlusAuth.showToast("Network error. Please try again.", "error");
          } else {
            alert("Network error.");
          }
        }
      });
    });
  </script>
</body>
</html>
